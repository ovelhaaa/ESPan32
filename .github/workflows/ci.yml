name: Build & Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Build host tests
        run: cmake --build build-host --config Release --parallel
      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Publish metrics summary
        run: |
          cat build-host/test_metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/saturation_ab_metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/output_stage_abc_metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_m5b_metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_m5c_metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_m5c2_body_coupling.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_doublet_ab.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_m5d_voicing.md >> "$GITHUB_STEP_SUMMARY"
          cat build-host/pan_m5d1_ab.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ESPan32-audio-tests
          path: |
            build-host/pan_*.wav
            build-host/test_metrics.md
            build-host/saturation_ab_metrics.md
            build-host/output_stage_abc_metrics.md
            build-host/pan_m5b_metrics.md
            build-host/pan_m5c_metrics.md
            build-host/pan_m5c2_body_coupling.md
            build-host/pan_doublet_ab.md
            build-host/pan_m5d_voicing.md
            build-host/pan_m5d1_ab.md
            build-host/pan_doublet_*.wav
            build-host/pan_register_*.wav
          if-no-files-found: error

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Package firmware
        shell: bash
        run: |
          mkdir -p ESPan32-firmware/bootloader ESPan32-firmware/partition_table
          cp build/bootloader/bootloader.bin ESPan32-firmware/bootloader/
          cp build/partition_table/partition-table.bin ESPan32-firmware/partition_table/
          cp build/pocket_pan.bin build/pocket_pan.elf build/pocket_pan.map ESPan32-firmware/
          cp build/flash_args ESPan32-firmware/
          test -f build/project_description.json && cp build/project_description.json ESPan32-firmware/
      - uses: actions/upload-artifact@v4
        with:
          name: ESPan32-firmware
          path: ESPan32-firmware/
          if-no-files-found: error
